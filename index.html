        .question-div {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .options-list {
            list-style-type: none;
            padding: 0;
        }

        .options-list li {
            margin-bottom: 12px;
        }

        .options-list label {
            display: block;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .options-list label:hover {
            background-color: #e0e0e0;
        }

        .options-list input[type="radio"] {
            margin-right: 10px;
            opacity: 0;
            position: absolute;
            pointer-events: none;
        }

        .options-list input[type="radio"]:checked+label {
            background-color: #cce5ff;
        }

        .submit-btn {
            display: block;
            padding: 12px 25px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            margin: 20px auto;
        }

        .submit-btn:hover {

        .result {

          function loadQuestions() {
             let sectionHTML = '';

            for (let sectionNumber = 1; sectionNumber <= 8; sectionNumber++) {
             const start = (sectionNumber -1)*10;
             const end = start + 10;

             const questionsSubset = questions.slice(start,end);
             sectionHTML = `<p class="result" data-result-section='${sectionNumber}' style="display:none;"></p>`;
           questionsSubset.forEach((question, index) => {
                    sectionHTML += `
                        <div class="question-div">
                            <p><strong>${start + index + 1}. ${question.question}</strong></p>
                            <ul class="options-list">
                               ${question.options.map(option => `
                                   <li>
                                       <input type="radio" name="question-${start + index}" id="option-${start + index}-${option.replace(/[^a-zA-Z0-9]/g, '')}" value="${option}">
                                       <label for="option-${start + index}-${option.replace(/[^a-zA-Z0-9]/g, '')}">${option}</label>
                                   </li>
                               `).join('')}
                            </ul>
                        </div>
                    `;

              });

                sectionHTML += `<button class="submit-btn" onclick="calculateResult(${sectionNumber})">Submit Section ${sectionNumber}</button>`;
                 document.querySelector(`[data-section="${sectionNumber}"]`).innerHTML = sectionHTML;

              if(sectionNumber>1) {
                document.querySelector(`[data-section="${sectionNumber}"]`).style.display = "none";
              }
            }


         }


         function calculateResult(sectionNumber) {
            let score = 0;
              const start = (sectionNumber -1)*10;
             const end = start + 10;
              const questionsSubset = questions.slice(start,end);
          questionsSubset.forEach((question, index) => {
                const selectedOption = document.querySelector(`input[name="question-${start + index}"]:checked`);
                if (selectedOption && selectedOption.value === question.correctAnswer) {
                    score++;
                }
            });

           const resultSection = document.querySelector(`[data-result-section="${sectionNumber}"]`);
            resultSection.innerHTML = `Your score for this section is: ${score} out of ${questionsSubset.length}`;
           resultSection.style.display = "block";


          const nextSection = sectionNumber+1;
           if(nextSection <=8) {
            const nextSectionElement =   document.querySelector(`[data-section="${nextSection}"]`);
            nextSectionElement.style.display = "block";
           }

             updateProgress(sectionNumber);
        }


         function updateProgress(sectionNumber) {
          const completedSections = sectionNumber;
            const progress = (completedSections/ 8)*100;
            progressBar.style.width = `${progress}%`;
        }
